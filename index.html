<!DOCTYPE html>
<html>

<head>
  <script src="js/window.js" defer="true"></script>
  <script src="js/select_menu.js" defer="true"></script>
  <script src="js/main.js" defer="true"></script>
  <script src="js/overlay.js" defer="true"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
  <div id="main_space">
    <window-frame name="Terminal" id="shell_window">
      <window-frame name="" id="title_window">
        <div id="title"></div>
      </window-frame>
      <pre id="write_space"></pre>
      <window-frame name="profile_picture.jpg" id="image_window">
        <img
          src="https://media.licdn.com/dms/image/v2/D4E03AQF8XgDUbDOVIw/profile-displayphoto-crop_800_800/B4EZnfivBeHgAM-/0/1760392049787?e=1763596800&v=beta&t=bPTkdUsbRHOyu2pzNtDYzF0_U8khR8NNv4fjFC3oAkA"
          alt="This is me" style="width: 20vh; border-radius: 0px 0px 5px 5px;">
      </window-frame>

      <window-frame name="CV" id="cv">
        <a href="src/cv.pdf" target="_blank"><i class="bi bi-filetype-pdf"></i> CV <i
            class="bi bi-box-arrow-up-right"></i></a>
      </window-frame>
      <window-frame name="Pitch" id="elevator_pitch">
        <a href="src/pitch-video-edited.mp4" target="_blank"><img src="src/video-preview.png" alt="video preview"
            id="video_previwew_image">
          <div style="position: absolute; top: calc(50% - 3vh); left: calc(50% - 3vh);">
            <i class="bi bi-play-fill" style="color: var(--text-color); font-size: 6vh;"></i>
          </div>
        </a>
      </window-frame>
      <window-frame name="links" id="link_window">
        <div
          style="display: flex; flex-direction: row; color: var(--text-color); font-size: xx-large; gap: 25px; padding: 10px;">
          <a href="https://github.com/erwan-fb" target="_blank"><i class="bi bi-github"></i></a>
          <a href="https://www.linkedin.com/in/erwan-falaux-bachelot-982b68386/" target="_blank"><i
              class="bi bi-linkedin"></i></a>
        </div>
      </window-frame>
      <window-frame name="Counting from 0 to 9 in COCS" id="code_preview">
        <img src="src/code_preview.png" alt="Little preview" id="code_preview_image">
      </window-frame>
      <window-frame name="Project link" id="link_project_window">
        <a href="https://yann-me.com/Finale-AOC/Code/" target="_blank">
          yann-me.com/Finale-AOC/Code/
        </a>
      </window-frame>
      <window-frame name="Girls Can Code logo" id="gcc_logo"><img
          src="https://girlscancode.fr/static/img/logo_gcc_blacktext.png" alt="Girls Can Code logo"
          id="gcc_logo_img"></window-frame>
      <window-frame name="Me, climbing" id="climbing_photo_window"><img src="src/climbing.jpg" alt="Me, climbing"
          id="climbing_photo"></window-frame>
      <window-frame name="Part of a crackme" id="ghidra_screenshot_window"><img src="src/ghidra_screenshot.png"
          alt="Part of a crackme" id="ghidra_screenshot"></window-frame>
      <window-frame name="Part of my brainfuck debugger" id="vscode_screenshot_window"><img
          src="src/vscode_screenshot.png" alt="Part of my brainfuck debugger" id="vscode_screenshot"></window-frame>
    </window-frame>
  </div>

  <div id="screen_overlay">
  </div>
</body>

</html>
